name: inli-watcher

on:
  schedule:
    # Toutes les 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # permet aussi de le lancer manuellement depuis GitHub

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements_cloud.txt

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python inli_watcher_cloud.py

      - name: Save updated state
        run: |
          git config user.name "inli-watcher-bot"
          git config user.email "actions@github.com"
          git add seen_listings.json
          git diff --quiet --cached || git commit -m "update seen listings"
          git push
